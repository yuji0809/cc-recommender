# .github/workflows/actions.lock がワークフローと同期しているか、
# ロックされた commit が upstream で検証できるかを確認する。
# lockfile の更新: gh extension install github/gh-actions-lock --pin v0.4.1 && gh actions-lock
name: Verify Actions Lockfile

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify actions.lock
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1

      - name: Verify lockfile
        run: gh actions-lock --verify
