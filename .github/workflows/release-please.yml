name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          release-type: node

  publish:
    needs: release-please
    runs-on: ubuntu-latest
    if: ${{ needs.release-please.outputs.release_created }}
    # npm Trusted Publishing (OIDC) 用。job レベルの permissions は workflow レベルを
    # 置き換えるため contents: read も明示する
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm run check

      - name: Run tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Verify npm supports trusted publishing and staged publishing
        run: |
          npm -v
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) { console.error("npm >= 11.5.1 is required for trusted publishing"); process.exit(1); }' "$(npm -v)"
          npm stage --help > /dev/null || { echo "npm stage is not available in this npm version"; exit 1; }

      # Trusted Publishing (OIDC) で認証し、公開待ち (staged) の状態で登録する。
      # メンテナーが 2FA 付きで承認するまで公開されない。
      - name: Stage release on npm
        run: npm stage publish --access public

      - name: Show how to approve the staged release
        run: |
          {
            echo "## npm に staged release を登録しました"
            echo ""
            echo "2FA 付きで承認すると公開されます:"
            echo ""
            echo '```bash'
            echo "npm stage list cc-recommender"
            echo "npm stage approve <stage-id>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
