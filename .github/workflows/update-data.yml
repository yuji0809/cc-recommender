name: Update Recommendations Database

on:
  # 毎日 AM 9:00 JST (00:00 UTC) に実行
  schedule:
    - cron: "0 0 * * *"

  # 手動実行も可能
  workflow_dispatch:

# 必要な権限を明示的に付与
permissions:
  contents: write
  pull-requests: write

jobs:
  update-database:
    name: Update Recommendations Database
    runs-on: ubuntu-latest
    timeout-minutes: 120 # 2時間タイムアウト（並列数10なら約60分で完了予定）

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch latest data
        timeout-minutes: 90 # データ取得＋スキャンのタイムアウト
        run: pnpm run fetch-data
        env:
          # セキュリティスキャン設定
          # "true": スキップ（高速、テスト用）
          # "false": 実行（推奨、差分スキャンで効率化済み）
          SKIP_SECURITY_SCAN: "false"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet data/plugins.json data/mcp-servers.json data/skills.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(data): update recommendations database"
          title: "chore(data): update recommendations database"
          body: |
            Automated update of the recommendations database (`data/*.json`).

            Sources:
            - Plugins: anthropics/claude-plugins-official
            - MCP servers: punkpeye/awesome-mcp-servers and the Official MCP Registry
            - Skills: the repositories in `src/config/direct-skill-sources.ts` and the lists in `src/config/curated-list-sources.ts`

            Before merging, check:
            - [ ] Item counts in `plugins.json`, `mcp-servers.json` and `skills.json` did not drop unexpectedly. A source that fails to fetch is written as an empty list.
            - [ ] No sensitive information is included.

            Merging this PR updates the data that running servers download at startup. The data bundled in the npm package changes with the next release.
          branch: update-recommendations-data
          delete-branch: true
          labels: |
            automated
            data-update
